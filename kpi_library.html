<title>Ditteau · KPI Library</title>
<style>
:root {
  --navy:#13405a; --maroon:#740049; --green:#5c861d; --blue:#4285f4;
  --teal:#1a7a6e; --purple:#7b50c8; --amber:#b86e00; --steel:#5a6e7a;
  --bg:#f0f4f6; --surface:#fff; --border:#c8d4da;
  --ff-ui:Verdana,Geneva,Tahoma,sans-serif;
  --ff-mono:'Courier New',Courier,monospace;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{background:var(--bg);font-family:var(--ff-ui);font-size:13px;color:#1a2a32;line-height:1.4}

.page{max-width:1320px;margin:0 auto;padding:2rem 1.25rem 4rem}

/* header */
.hdr{border-bottom:3px solid var(--navy);padding-bottom:1rem;margin-bottom:1.5rem}
.hdr .eye{font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;color:var(--steel);margin-bottom:.3rem}
.hdr h1{font-family:Georgia,serif;font-size:1.6rem;font-weight:normal;color:var(--navy);line-height:1.2}
.hdr .sub{font-size:.72rem;color:var(--steel);margin-top:.3rem}
.hdr .dash-link{display:inline-flex;align-items:center;gap:.35rem;margin-top:.75rem;padding:.4rem .75rem;background:var(--maroon);color:#fff;text-decoration:none;border-radius:3px;font-size:.75rem;font-weight:bold;letter-spacing:.02em;transition:all .2s}
.hdr .dash-link:hover{background:#8b0057;transform:translateY(-1px);box-shadow:0 2px 6px rgba(116,0,73,.25)}
.hdr .dash-link svg{width:14px;height:14px;fill:currentColor}
.counts{display:flex;flex-wrap:wrap;gap:.5rem;margin-top:1rem}
.count-pill{display:inline-flex;align-items:center;gap:.4rem;padding:.25rem .65rem;border-radius:2px;font-size:.7rem;font-weight:bold;background:#e0e8ed;color:var(--navy)}
.count-pill.kpi{background:#e8f0fd;color:var(--blue)}
.count-pill.chart{background:#e6f4f2;color:var(--teal)}
.count-pill.dashboard{background:#f2ecfd;color:var(--purple)}

/* filter bar */
.filterbar{display:flex;flex-wrap:wrap;gap:.75rem;align-items:center;margin-bottom:1rem;padding:.6rem .75rem;background:var(--surface);border:1px solid var(--border)}
.filter-label{font-size:.68rem;text-transform:uppercase;letter-spacing:.08em;color:var(--steel);white-space:nowrap}
.filter-group{display:flex;flex-wrap:wrap;gap:.3rem}
.fbtn{padding:.2rem .55rem;font-size:.68rem;font-family:var(--ff-ui);border:1px solid var(--border);background:var(--bg);color:var(--steel);cursor:pointer;border-radius:2px;font-weight:bold;letter-spacing:.03em}
.fbtn.active{background:var(--navy);color:#fff;border-color:var(--navy)}
.divider{width:1px;background:var(--border);align-self:stretch}

/* search */
#search{padding:.25rem .5rem;font-size:.72rem;font-family:var(--ff-ui);border:1px solid var(--border);background:var(--bg);border-radius:2px;width:180px;color:#1a2a32}
#search:focus{outline:none;border-color:var(--navy)}

/* table */
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;background:var(--surface);font-size:.75rem}
thead th{background:var(--navy);color:#fff;padding:.5rem .6rem;text-align:left;font-size:.65rem;text-transform:uppercase;letter-spacing:.08em;white-space:nowrap;position:sticky;top:0;z-index:2}
tbody tr{border-bottom:1px solid var(--border)}
tbody tr:nth-child(even){background:#f7fafb}
tbody tr:hover{background:#eef5f8}
tbody tr.hidden{display:none}
td{padding:.45rem .6rem;vertical-align:top;line-height:1.35}

/* area badge */
.area{display:inline-block;font-size:.62rem;padding:.1rem .35rem;border-radius:2px;font-weight:bold;letter-spacing:.03em;white-space:nowrap}
.area.Admissions{background:#fdf0f6;color:var(--maroon);border:1px solid #d999bb}
.area.Registration{background:#edf4e5;color:var(--green);border:1px solid #a8c57a}
.area.Financial-Aid{background:#fffbe8;color:#8a6a00;border:1px solid #d4c060}
.area.Enrollment-Management{background:#e8f0f5;color:var(--navy);border:1px solid #9ab9cd}
.area.Cross-Domain{background:#f3f0fb;color:#5a3d9e;border:1px solid #c0aee8}
.area.Benchmarking{background:#e6f4f2;color:var(--teal);border:1px solid #8fc4bd}

/* type badge */
.type-badge{display:inline-block;font-size:.62rem;padding:.1rem .38rem;border-radius:2px;font-weight:bold;white-space:nowrap}
.type-badge.KPI{background:#e8f0fd;color:var(--blue)}
.type-badge.Chart{background:#e6f4f2;color:var(--teal)}
.type-badge.Dashboard{background:#f2ecfd;color:var(--purple)}

/* mart name */
.mname{font-family:var(--ff-mono);font-size:.68rem;color:var(--navy)}

/* dbt-style metric reference (mart.column) + calc-logic tooltip */
.dbt-metric{font-family:var(--ff-mono);font-size:.7rem;color:var(--navy);background:#eef3f6;border:1px solid var(--border);border-radius:2px;padding:.05rem .35rem;cursor:help;white-space:nowrap}
.metric-flag{display:inline-block;font-size:.6rem;font-weight:bold;padding:.05rem .3rem;border-radius:2px;margin-left:.4rem;white-space:nowrap;cursor:help}
.metric-flag.nyc{background:#fdf3e0;color:var(--amber);border:1px solid #e0b877}
.metric-flag.nocatalog{background:#eef1f3;color:var(--steel);border:1px solid var(--border)}

/* category badge (Strategic / Operational / Analytical / Tactical) */
.cat-badge{display:inline-block;font-size:.62rem;padding:.1rem .38rem;border-radius:2px;font-weight:bold;white-space:nowrap}
.cat-badge.Strategic{background:#e8f0f5;color:var(--navy);border:1px solid #9ab9cd}
.cat-badge.Operational{background:#edf4e5;color:var(--green);border:1px solid #a8c57a}
.cat-badge.Analytical{background:#fdf0e0;color:var(--amber);border:1px solid #e0b877}
.cat-badge.Tactical{background:#fdf0f6;color:var(--maroon);border:1px solid #d999bb}

/* title col */
.kpi-title{font-weight:bold;font-size:.78rem;color:#1a2a32}

/* result counter */
.result-info{font-size:.7rem;color:var(--steel);margin-bottom:.5rem;padding-left:.25rem}

/* expandable row */
tbody tr.data-row{cursor:pointer}
tbody tr.data-row:hover{background:#e8f0f5}
tbody tr.data-row td:first-child::before{content:"▸";display:inline-block;width:1em;margin-right:.3rem;color:var(--steel);transition:transform .15s}
tbody tr.data-row.expanded td:first-child::before{transform:rotate(90deg)}
tbody tr.detail-row{display:none;background:#f7fafb}
tbody tr.detail-row.visible{display:table-row}
tbody tr.detail-row td{padding:.6rem 1rem;border-bottom:2px solid var(--border)}
.detail-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:.75rem 1.5rem;font-size:.72rem}
.detail-item{display:flex;flex-direction:column;gap:.15rem}
.detail-label{font-size:.62rem;text-transform:uppercase;letter-spacing:.08em;color:var(--steel);font-weight:bold}
.detail-value{color:#1a2a32}
.detail-value.empty{color:var(--steel);font-style:italic}
.lifecycle-badge{display:inline-block;font-size:.6rem;padding:.1rem .4rem;border-radius:2px;font-weight:bold;text-transform:uppercase}
.lifecycle-badge.draft{background:#fff3cd;color:#856404;border:1px solid #ffc107}
.lifecycle-badge.active{background:#d4edda;color:#155724;border:1px solid #28a745}
.lifecycle-badge.deprecated{background:#f8d7da;color:#721c24;border:1px solid #dc3545}
.lifecycle-badge.proposed{background:#e2e3e5;color:#383d41;border:1px solid #6c757d}
</style>

  "1": {ref:"mart_admissions_funnel.inquiry_to_app_rate", calc:"Numerator: distinct applicants with funnel_stage_canonical in (applied, complete, admitted, deposited, enrolled, denied, withdrawn_app); denominator: all applicants including inquiry stage. Rounded to 4 decimal places; COALESCE to 0 on zero denominator. Column: inquiry_to_app_rate.", flag:null},

  "3": {ref:"mart_admissions_funnel.yield_rate", calc:"Numerator: distinct applicants in (deposited, enrolled); denominator: distinct applicants in (admitted, deposited, enrolled). Rounded to 4 decimals; COALESCE to 0. Column: yield_rate.", flag:null},
  "4": {ref:"mart_admissions_funnel.deposit_count", calc:"Count of distinct applicants with funnel_stage_canonical in (deposited, enrolled) per program × entry term. Column: deposit_count.", flag:null},
  "5": {ref:"mart_admissions_funnel.stealth_app_pct", calc:"Numerator: distinct applicants with stealth_flag=true; denominator: distinct applicants in (applied, complete, admitted, deposited, enrolled, denied, withdrawn_app). COALESCE to 0. Column: stealth_app_pct.", flag:null},
  "6": {ref:"mart_admissions_funnel.application_completion_rate", calc:"app_complete_count (in complete, admitted, deposited, enrolled) divided by app_started_count (in applied, complete, admitted, deposited, enrolled, denied, withdrawn_app). No pre-computed rate column in mart; BI layer must divide app_complete_count / app_started_count.", flag:null},
  "7": {ref:"mart_admissions_class_profile.avg_academic_profile", calc:"avg_hs_gpa: mean hs_gpa over enrolled applicants (enrolled_flag=true). avg_sat_total: mean sat_total where test_optional_flag=false. avg_act_composite: mean act_composite where test_optional_flag=false. All restricted to fact_application.enrolled_flag=true.", flag:null},
  "8": {ref:"mart_admissions_class_profile.geographic_diversity_index", calc:"geographic_diversity_index = 1 − SUM[(tier_count / total_enrolled)²] across three geo tiers: in_state, out_of_state, international. Range 0 (all from one tier) to ~0.67 (even split). Higher = more diverse. Column: geographic_diversity_index.", flag:null},
  "9": {ref:"mart_admissions_class_profile.first_gen_rate", calc:"Mean of (is_first_generation=true ? 1.0 : 0.0) over enrolled applicants joined to dim_student via person_id = student_id where is_current=true. COALESCE to 0. Column: first_gen_rate.", flag:null},
  "10": {ref:"mart_admissions_class_profile.urm_rate", calc:"Mean of (is_urm=true ? 1.0 : 0.0) over enrolled applicants joined to dim_student via person_id = student_id where is_current=true. COALESCE to 0. Column: urm_rate.", flag:null},
  "11": {ref:"mart_admissions_funnel.active_counselor_count", calc:"Count of distinct counselor_ref values for applicants with enrolled_flag=true per program × term. Column: active_counselor_count.", flag:null},
  "12": {ref:"mart_admissions_funnel.cost_per_enrolled_student", calc:"Total recruitment budget (from GL — not in mart) divided by enrolled_count. Mart provides enrolled_count denominator only; numerator requires external GL cost source.", flag:null},
  "13": {ref:"mart_admissions_funnel.application_processing_time", calc:"avg_days_app_to_complete: mean days from application start to complete status; avg_days_complete_to_decision: mean days from complete to admission decision; avg_days_inquiry_to_decision: mean days from first inquiry to decision. All averaged per program × term excluding nulls.", flag:null},
  "14": {ref:"mart_admissions_funnel.crm_engagement_score", calc:"NOT YET COMPUTABLE — engagement_score_avg is hardcoded null::numeric in mart_admissions_funnel pending confirmation of stg_slate__applications.engagement_score.", flag:"nyc"},
  "15": {ref:"snap_admissions_weekly.year_over_year_funnel_comparison", calc:"Time-series view of admissions funnel metrics — same inquiry_count, app_complete_count, admit_count, deposit_count, enrolled_count, inquiry_to_app_rate, admit_rate, yield_rate as mart_admissions_funnel base KPIs; one row per program × entry term × snapshot_week_num (weeks since Oct 1 of entry-year cycle start; negative = pre-Oct 1 activity).", flag:null},
  "16": {ref:"snap_admissions_weekly.inquiry_to_app_conversion", calc:"Time-series view of Inquiry-to-Application Rate — same calculation as base KPI (inquiry_to_app_rate); one row per program × entry term × snapshot_week_num.", flag:null},
  "17": {ref:"snap_admissions_weekly.yield_rate", calc:"Time-series view of Admit-to-Yield Rate — same calculation as base KPI (yield_rate); one row per program × entry term × snapshot_week_num.", flag:null},
  "18": {ref:"snap_admissions_weekly.deposit_pace_vs_prior_year", calc:"Time-series view of Deposit Conversions — deposit_count (applicants in deposited or enrolled stage) per program × entry term × snapshot_week_num; cumulative within each entry-term cycle.", flag:null},
  "19": {ref:"snap_admissions_weekly.application_volume", calc:"Time-series view of application volume — app_started_count (applicants in applied/complete/admitted/deposited/enrolled/denied/withdrawn_app) and app_complete_count per program × entry term × snapshot_week_num.", flag:null},
  "20": {ref:"snap_admissions_weekly.stealth_applicant", calc:"Time-series view of Stealth Applicant % — stealth_app_count and implied stealth_app_pct; same logic as base KPI per program × entry term × snapshot_week_num.", flag:null},
  "21": {ref:"snap_admissions_weekly.avg_academic_profile", calc:"NO CONFIDENT MATCH — snap_admissions_weekly contains funnel stage counts and conversion rates only; avg_hs_gpa, avg_sat_total, and avg_act_composite are not present in this snapshot.", flag:null},
  "22": {ref:"snap_enrollment_term.geographic_diversification", calc:"NOT YET COMPUTABLE — snap_enrollment_term has a null-stub residency_type column; geographic tier breakdown is not populated and no geographic_diversity_index column exists in this model.", flag:"nyc"},
  "23": {ref:"snap_admissions_weekly.feeder_school_concentration", calc:"NO CONFIDENT MATCH — snap_admissions_weekly aggregates at program × entry term grain; feeder_concentration_index is in mart_admissions_class_profile (not snap_admissions_weekly) and no feeder school columns are present in the snapshot.", flag:null},
  "24": {ref:"mart_admissions_funnel.funnel_pipeline", calc:"COMPOSITE — draws inquiry_count, app_started_count, app_complete_count, admit_count, deposit_count, enrolled_count, inquiry_to_app_rate, admit_rate, yield_rate, deposit_to_enroll_rate from mart_admissions_funnel at program × entry term grain. Needs manual definition.", flag:null},
  "25": {ref:"mart_admissions_funnel.yield_management", calc:"COMPOSITE — draws yield_rate, deposit_count, enrolled_count, admit_rate from mart_admissions_funnel; aid sensitivity (yield by aid band) requires mart_aid_leveraging which is a stub; competitor overlap not in any current mart. Needs manual definition.", flag:null},
  "26": {ref:"mart_admissions_class_profile.class_profile", calc:"COMPOSITE — draws avg_hs_gpa, avg_sat_total, avg_act_composite, test_optional_rate (academic profile); geographic_diversity_index, in_state_count, out_of_state_count, international_count (geographic); first_gen_rate, urm_rate (diversity); feeder_concentration_index from mart_admissions_class_profile at program × entry term grain. Needs manual definition.", flag:null},
  "27": {ref:"mart_admissions_funnel.counselor_activity", calc:"COMPOSITE — draws active_counselor_count from mart_admissions_funnel; travel schedule, event ROI, and territory performance require external data not in this mart. Needs manual definition.", flag:null},
  "28": {ref:"snap_admissions_weekly.cycle_over_cycle_funnel", calc:"COMPOSITE — draws funnel stage counts and conversion rates (inquiry_count, app_complete_count, admit_count, deposit_count, enrolled_count, yield_rate) from snap_admissions_weekly; indexed by snapshot_week_num for same-week prior-cycle comparison. Needs manual definition.", flag:null},
  "29": {ref:"snap_admissions_weekly.5_year_funnel", calc:"COMPOSITE — draws funnel counts and conversion rates from snap_admissions_weekly across the most recent 5 entry-term academic years. Needs manual definition.", flag:null},
  "30": {ref:"snap_admissions_weekly.territory_performance_over_time", calc:"NO CONFIDENT MATCH — snap_admissions_weekly aggregates at program × entry term grain with no counselor or territory dimension; territory-level yield and conversion breakdown is not available in this mart.", flag:null},
  "31": {ref:"mart_section_utilization.section_fill_rate", calc:"NOT YET COMPUTABLE — fill_rate is null stub in mart_section_utilization; requires section_capacity column not yet added to dim_course_section. enrolled_count per section is available.", flag:"nyc"},
  "32": {ref:"mart_section_utilization.waitlist_pressure_rate", calc:"waitlisted_count per section divided by (enrolled_count + waitlisted_count) per section; null when both enrolled and waitlisted are zero. Column: waitlist_pressure_rate.", flag:null},
  "33": {ref:"mart_section_utilization.course_demand_vs_capacity_gap", calc:"NOT YET COMPUTABLE — capacity_gap is null stub (section_capacity not yet in dim_course_section). total_demand_count (enrolled + waitlisted + dropped per section) is available as a raw-demand proxy.", flag:"nyc"},
  "34": {ref:"mart_enrollment_census.credits_per_fte", calc:"total_registered_hours divided by fte per (program, student_type, load_status, term) group. FTE = IPEDS formula: UG registered_hours / 15; Graduate registered_hours / 9. Denominator uses NULLIF to avoid divide-by-zero. Column: credits_per_fte.", flag:null},

  "131": {ref:"mart_retention_cohort_summary.retention_risk_early_warning_indicators", calc:"PROPOSED — as cataloged this points to mart_retention_cohort_summary (yr1_retention_rate, stop_out rates — all lagging, cohort-level), not a real-time risk signal. The platform's actual early-warning data (is_at_risk, risk_tier, risk_factor_count) lives in mart_student_at_risk — likely a mart-assignment mismatch to confirm.", flag:"nyc"},
  "132": {ref:"mart_scorecard_program_outcomes.program_earnings_vs_debt_roi", calc:"PROPOSED — median post_completion_earnings divided by median debt_at_completion, by program and credential level, from mart_scorecard_program_outcomes. This mart is not in the documented mart inventory and has no references in this dashboard's code — confirm schema and feed with data engineering.", flag:null},
  "133": {ref:"mart_scorecard_program_outcomes.post_graduation_earnings_benchmarking", calc:"PROPOSED — median post_completion_earnings by program benchmarked against the College Scorecard national/peer-group median for the matching CIP code and credential level, from mart_scorecard_program_outcomes (not yet in the mart inventory).", flag:"nyc"},
  "134": {ref:"mart_scorecard_program_outcomes.pell_vs_non_pell_earnings_gap", calc:"PROPOSED — mean post_completion_earnings for pell_recipient=true minus pell_recipient=false students, by program, from mart_scorecard_program_outcomes. Requires a new join to mart_aid_summary.is_pell_recipient at the student-program grain.", flag:null},
  "135": {ref:"mart_scorecard_program_outcomes.student_debt_burden_vs_peers", calc:"PROPOSED — median debt_at_completion by program from mart_scorecard_program_outcomes, benchmarked against the College Scorecard national/peer-group median for the matching CIP code and credential level.", flag:"nyc"},
  "136": {ref:"mart_scorecard_program_outcomes.loan_default_rate", calc:"PROPOSED — published cdr_3yr figure from the U.S. Dept. of Education via College Scorecard, ingested as-is rather than computed. Mirrors the existing Cohort Default Rate (CDR) KPI (PowerFAIDS / NSC, also NOT YET COMPUTABLE) — reconcile whether these are the same metric on two different marts.", flag:null},
  "137": {ref:"mart_scorecard_program_outcomes.borrower_based_repayment_rate", calc:"PROPOSED — share of a program's borrower cohort with a declining or current loan balance within the federal measurement window, per the Financial Value Transparency / Gainful Employment rules, published via College Scorecard and ingested as-is.", flag:null},
  "138": {ref:"mart_scorecard_program_outcomes.earnings_to_debt_ratio_by_program", calc:"PROPOSED — median post_completion_earnings divided by median debt_at_completion by program (inverse framing of the federal debt-to-earnings ratio used in gainful employment determinations), from mart_scorecard_program_outcomes.", flag:null},
};
const AREA_ORDER = ["All","Admissions","Registration","Financial Aid","Enrollment Management","Cross-Domain","Benchmarking"];
const TYPE_ORDER = ["All","KPI","Chart","Dashboard"];
const CATEGORY_ORDER = ["All","Strategic","Operational","Analytical","Tactical"];

let activeArea = "All";
let activeType = "All";
let activeCategory = "All";
let searchVal  = "";

function computeType(d){
  if(d.type==="Dashboard") return "Dashboard";
  if(CHART_WORDS.some(w=>d.title.includes(w))) return "Chart";
  return "KPI";
}

function escapeHtml(s){
  return s.replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}

function metricInfo(n){
  return METRIC_INFO[n] || {ref:"—", calc:"No metric definition available.", flag:"nocatalog"};
}

function areaClass(a){ return a.replace(/\s+/g,"-"); }

function buildCounts(){
  const el = document.getElementById("counts");
  const all = DATA.length;
  const types = {KPI:0,Chart:0,Dashboard:0};
  DATA.forEach(d=>{types[computeType(d)]++;});
  [{lbl:"All ("+all+")",cls:""},
   {lbl:"KPI ("+types.KPI+")",cls:"kpi"},
   {lbl:"Chart ("+types.Chart+")",cls:"chart"},
   {lbl:"Dashboard ("+types.Dashboard+")",cls:"dashboard"}
  ].forEach(item=>{
    const p=document.createElement("span");
    p.className="count-pill"+(item.cls?" "+item.cls:"");
    p.textContent=item.lbl;
    el.appendChild(p);
  });
}

function buildFilters(){
  const af=document.getElementById("area-filters");
  AREA_ORDER.forEach(a=>{
    const b=document.createElement("button");
    b.className="fbtn"+(a==="All"?" active":"");
    b.dataset.val=a;
    b.textContent=a==="Enrollment Management"?"Enrollment Mgmt":a;
    b.onclick=()=>{
      activeArea=a;
      af.querySelectorAll(".fbtn").forEach(x=>x.classList.remove("active"));
      b.classList.add("active");
      applyFilters();
    };
    af.appendChild(b);
  });
  const tf=document.getElementById("type-filters");
  TYPE_ORDER.forEach(t=>{
    const b=document.createElement("button");
    b.className="fbtn"+(t==="All"?" active":"");
    b.dataset.val=t;
    b.textContent=t;
    b.onclick=()=>{
      activeType=t;
      tf.querySelectorAll(".fbtn").forEach(x=>x.classList.remove("active"));
      b.classList.add("active");
      applyFilters();
    };
    tf.appendChild(b);
  });
  const cf=document.getElementById("cat-filters");
  CATEGORY_ORDER.forEach(c=>{
    const b=document.createElement("button");
    b.className="fbtn"+(c==="All"?" active":"");
    b.dataset.val=c;
    b.textContent=c;
    b.onclick=()=>{
      activeCategory=c;
      cf.querySelectorAll(".fbtn").forEach(x=>x.classList.remove("active"));
      b.classList.add("active");
      applyFilters();
    };
    cf.appendChild(b);
  });
  document.getElementById("search").oninput=function(){
    searchVal=this.value.toLowerCase().trim();
    applyFilters();
  };
}

function formatDetailValue(val, fallback){
  if(!val || val.trim()==="") return '<span class="detail-value empty">'+fallback+'</span>';
  return '<span class="detail-value">'+escapeHtml(val)+'</span>';
}

function formatLifecycle(status){
  const s = (status||"").toLowerCase().trim();
  const cls = ["draft","active","deprecated","proposed"].includes(s) ? s : "draft";
  const label = s || "draft";
  return '<span class="lifecycle-badge '+cls+'">'+label+'</span>';
}

function buildTable(){
  const tbody=document.getElementById("tbody");
  DATA.forEach(d=>{
    const t=computeType(d);
    const mi=metricInfo(d.n);
    const ac=areaClass(d.area);

    // Main data row
    const tr=document.createElement("tr");
    tr.className="data-row";
    tr.dataset.area=d.area;
    tr.dataset.type=t;
    tr.dataset.cat=d.cat;
    tr.dataset.search=(d.title+" "+d.area+" "+d.mart+" "+mi.ref+" "+d.cat+" "+(d.owner||"")+" "+(d.declared_consumers||"")).toLowerCase();
    const flagHtml = mi.flag==="nyc"
      ? '<span class="metric-flag nyc" title="'+escapeHtml(mi.calc)+'">⚠ not yet computable</span>'
      : mi.flag==="nocatalog"
      ? '<span class="metric-flag nocatalog" title="'+escapeHtml(mi.calc)+'">no catalog entry</span>'
      : '';
    tr.innerHTML=
      '<td style="color:var(--steel);font-variant-numeric:tabular-nums;white-space:nowrap">'+d.n+'</td>'+
      '<td><span class="area '+ac+'">'+d.area+'</span></td>'+
      '<td><span class="kpi-title">'+d.title+'</span></td>'+
      '<td><span class="type-badge '+t+'">'+t+'</span></td>'+
      '<td><span class="cat-badge '+d.cat+'">'+d.cat+'</span></td>'+
      '<td><span class="mname">'+d.mart+'</span></td>'+
      '<td><span class="dbt-metric" title="'+escapeHtml(mi.calc)+'">'+mi.ref+'</span>'+flagHtml+'</td>';
    tbody.appendChild(tr);

    // Detail row (hidden by default)
    const detailTr=document.createElement("tr");
    detailTr.className="detail-row";
    detailTr.dataset.area=d.area;
    detailTr.dataset.type=t;
    detailTr.dataset.cat=d.cat;
    detailTr.innerHTML=
      '<td colspan="7">'+
        '<div class="detail-grid">'+
          '<div class="detail-item"><span class="detail-label">Owner</span>'+formatDetailValue(d.owner,"Not assigned")+'</div>'+
          '<div class="detail-item"><span class="detail-label">Declared Consumers</span>'+formatDetailValue(d.declared_consumers,"None declared")+'</div>'+
          '<div class="detail-item"><span class="detail-label">Freshness SLA</span>'+formatDetailValue(d.freshness_sla,"Not defined")+'</div>'+
          '<div class="detail-item"><span class="detail-label">Lifecycle Status</span>'+formatLifecycle(d.lifecycle_status)+'</div>'+
          '<div class="detail-item" style="grid-column:1/-1"><span class="detail-label">Calculation Logic</span><span class="detail-value" style="font-family:var(--ff-mono);font-size:.68rem;line-height:1.5">'+escapeHtml(mi.calc)+'</span></div>'+
        '</div>'+
      '</td>';
    tbody.appendChild(detailTr);

    // Click handler to toggle detail row
    tr.onclick=function(){
      const isExpanded=tr.classList.toggle("expanded");
      detailTr.classList.toggle("visible",isExpanded);
    };
  });
}

function applyFilters(){
  let shown=0;
  const rows=document.querySelectorAll("#tbody tr.data-row");
  rows.forEach(tr=>{
    const matchArea=activeArea==="All"||tr.dataset.area===activeArea;
    const matchType=activeType==="All"||tr.dataset.type===activeType;
    const matchCategory=activeCategory==="All"||tr.dataset.cat===activeCategory;
    const matchSearch=!searchVal||tr.dataset.search.includes(searchVal);
    const vis=matchArea&&matchType&&matchCategory&&matchSearch;
    tr.classList.toggle("hidden",!vis);
    // Also handle the detail row (next sibling)
    const detailTr=tr.nextElementSibling;
    if(detailTr && detailTr.classList.contains("detail-row")){
      detailTr.classList.toggle("hidden",!vis);
      // Collapse expanded rows when filtering hides them
      if(!vis){
        tr.classList.remove("expanded");
        detailTr.classList.remove("visible");
      }
    }
    if(vis) shown++;
  });
  const info=document.getElementById("result-info");
  const filters=[];
  if(activeArea!=="All") filters.push(activeArea);
  if(activeType!=="All") filters.push(activeType);
  if(activeCategory!=="All") filters.push(activeCategory);
  if(searchVal) filters.push('"'+searchVal+'"');
  info.textContent=shown+" of "+DATA.length+" entries"+(filters.length?" · "+filters.join(" · "):"");
}

buildCounts();
buildFilters();
buildTable();
applyFilters();
</script>
